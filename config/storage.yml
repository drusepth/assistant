test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# The storage seam (D-storage-seam): one ENV-driven, S3-compatible service covering AWS
# S3, Cloudflare R2, Backblaze B2, and self-hosted MinIO — pick it with
# ACTIVE_STORAGE_SERVICE=s3. Endpoint stays unset for AWS itself; MinIO also
# needs STORAGE_FORCE_PATH_STYLE=true. Full setup docs: docs/STORAGE.md.
s3:
  service: S3
  access_key_id: <%= ENV["STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["STORAGE_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("STORAGE_REGION", "us-east-1") %>
  bucket: <%= ENV["STORAGE_BUCKET"] %>
  <% if ENV["STORAGE_ENDPOINT"].present? %>
  endpoint: <%= ENV["STORAGE_ENDPOINT"] %>
  <% end %>
  <% if ENV["STORAGE_FORCE_PATH_STYLE"].present? %>
  force_path_style: <%= ENV["STORAGE_FORCE_PATH_STYLE"] == "true" %>
  <% end %>

# The documented local→S3 migration path (docs/STORAGE.md): mirror new
# uploads to both while you copy the old blobs across, then flip
# ACTIVE_STORAGE_SERVICE to s3 and drop the mirror.
mirror:
  service: Mirror
  primary: local
  mirrors: [ s3 ]
