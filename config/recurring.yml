# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # The agent's cadences (D20): weekly covers Quiet + Active sections,
  # daily covers Active only. Fingerprint dedup makes overlap harmless.
  weekly_agent_scan:
    command: "AgentScanJob.scan_all(cadence: :weekly)"
    schedule: every monday at 8am
  daily_agent_scan:
    command: "AgentScanJob.scan_all(cadence: :daily)"
    schedule: every day at 8:30am
  # Background sync for linked accounts (email plan E0): the fan-out runs
  # often; each link's registry sync_every decides whether it's due, so
  # email polls at minutes while DAV stays hourly.
  sync_linked_accounts:
    command: "SyncLinkedAccountJob.sync_stale"
    schedule: every 2 minutes
  # The mirror is a window, not an archive (EMAIL_PLAN.md §4).
  prune_email_mirror:
    command: "Email::PruneMirrorJob.prune_all"
    schedule: every day at 3:30am
  # Per-user digest times can't be one cron entry (EMAIL_PLAN.md §7):
  # the dispatcher fires each user's digest when their local hour arrives.
  dispatch_mail_digests:
    command: "Email::DigestJob.dispatch_due"
    schedule: every 15 minutes
  # User-armed reminders (D-reminders). Five minutes is the granularity
  # the pickers promise: "4pm" means 4:00–4:05, and nothing in the app
  # asks for tighter than that.
  dispatch_reminders:
    command: "Reminders::DispatchJob.dispatch_due"
    schedule: every 5 minutes
  # The reader's feeds (D-feed-reader). The sweep runs often; each feed's
  # own interval (hourly by default, backed off when it fails, longer when
  # nobody reads it) decides whether it's actually fetched — the politeness
  # rule for the one part of the app that polls strangers' servers.
  refresh_feeds:
    command: "RefreshFeedsJob.refresh_due"
    schedule: every 15 minutes
  # The event radar's listing sources (D-listing-feeds): same sweep shape,
  # a six-hour floor per source — listings are not news.
  refresh_listings:
    command: "RefreshListingsJob.refresh_due"
    schedule: every 30 minutes
  # Chat transcripts are ephemeral; recaps are the record (D33/Q13).
  prune_chat_transcripts:
    command: "PruneChatTranscriptsJob.perform_later"
    schedule: every sunday at 4am
  # Checked shopping-list lines are kept a month for "what did we buy last
  # time", then go (docs/FOOD_PLAN.md §3).
  sweep_shopping_history:
    command: "ShoppingList.sweep_history"
    schedule: every day at 3:45am
  # Recipes saved or edited since yesterday get their ingredients filed onto
  # each kitchen's foods (D-food-catalog) — a key is asked about once, ever.
  resolve_kitchen_foods:
    command: "ResolveFoodsJob.sweep"
    schedule: every day at 4:15am
